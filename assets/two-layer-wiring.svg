<svg viewBox="0 0 1000 560" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc" style="font-family: ui-sans-serif, system-ui, sans-serif;">
  <title id="title">Two-layer wiring: autonomous heartbeat + interactive sibling</title>
  <desc id="desc">A cloud Routine fires autonomously on a schedule and posts a brief plus open questions to Slack. Without a second layer, the questions ask themselves and wait forever. The closure pattern is a sibling desktop task that wakes 15 minutes later, mirrors Slack output to disk, and drives the open ASKs into a live conversation. Two layers, both active. Alarm clock plus meeting.</desc>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#6b7280"/>
    </marker>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#3b82f6"/>
    </marker>
    <marker id="arrow-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#d97706"/>
    </marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#dc2626"/>
    </marker>
  </defs>

  <!-- HEADER -->
  <text x="500" y="34" text-anchor="middle" font-size="19" font-weight="700" fill="#111827">Alarm clock + meeting. Autonomous + interactive.</text>
  <text x="500" y="56" text-anchor="middle" font-size="13" fill="#6b7280">A heartbeat that fires into a channel nobody opens is a question that asks itself and waits forever.</text>

  <!-- ====== TOP LAYER — AUTONOMOUS ====== -->
  <rect x="40" y="90" width="920" height="180" rx="14" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="60" y="115" font-size="11" font-weight="700" fill="#3b82f6" letter-spacing="2">LAYER 1 — AUTONOMOUS</text>
  <text x="60" y="133" font-size="11" fill="#3b82f6">fires on a schedule · runs without you · the alarm clock</text>

  <!-- Cloud Routine box -->
  <rect x="80" y="155" width="220" height="100" rx="8" fill="#ffffff" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="190" y="178" text-anchor="middle" font-size="10" font-weight="600" fill="#3b82f6" letter-spacing="1">CLOUD ROUTINE</text>
  <text x="190" y="200" text-anchor="middle" font-size="13" font-weight="600" fill="#111827">7 AM Mon–Fri</text>
  <text x="190" y="220" text-anchor="middle" font-size="11" fill="#4b5563">reads repo, composes</text>
  <text x="190" y="238" text-anchor="middle" font-size="11" fill="#4b5563">brief + open ASKs</text>

  <!-- Slack box (top) -->
  <rect x="390" y="155" width="220" height="100" rx="8" fill="#ffffff" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="500" y="178" text-anchor="middle" font-size="10" font-weight="600" fill="#3b82f6" letter-spacing="1">SLACK CHANNEL</text>
  <text x="500" y="200" text-anchor="middle" font-size="13" font-weight="600" fill="#111827">#kubrick</text>
  <text x="500" y="220" text-anchor="middle" font-size="11" fill="#4b5563">brief lands here</text>
  <text x="500" y="238" text-anchor="middle" font-size="11" fill="#4b5563">ASKs sit at the bottom</text>

  <!-- arrow: Routine -> Slack -->
  <line x1="300" y1="205" x2="385" y2="205" stroke="#3b82f6" stroke-width="1.5" marker-end="url(#arrow-blue)"/>
  <text x="342" y="198" text-anchor="middle" font-size="10" fill="#3b82f6">post</text>

  <!-- Failure mode (no layer 2) -->
  <rect x="700" y="155" width="220" height="100" rx="8" fill="#fee2e2" stroke="#dc2626" stroke-width="1.2" stroke-dasharray="4 3"/>
  <text x="810" y="178" text-anchor="middle" font-size="10" font-weight="600" fill="#dc2626" letter-spacing="1">WITHOUT LAYER 2</text>
  <text x="810" y="200" text-anchor="middle" font-size="13" font-weight="600" fill="#7f1d1d">ASKs sit unread</text>
  <text x="810" y="220" text-anchor="middle" font-size="11" fill="#991b1b">brief drifts</text>
  <text x="810" y="238" text-anchor="middle" font-size="11" fill="#991b1b">brain falls behind</text>

  <line x1="610" y1="205" x2="695" y2="205" stroke="#dc2626" stroke-width="1.2" stroke-dasharray="4 3" marker-end="url(#arrow-red)"/>
  <text x="652" y="198" text-anchor="middle" font-size="10" fill="#dc2626">drift</text>

  <!-- ====== BOTTOM LAYER — INTERACTIVE ====== -->
  <rect x="40" y="310" width="920" height="220" rx="14" fill="#fff7ed" stroke="#d97706" stroke-width="1.5"/>
  <text x="60" y="335" font-size="11" font-weight="700" fill="#d97706" letter-spacing="2">LAYER 2 — INTERACTIVE</text>
  <text x="60" y="353" font-size="11" fill="#d97706">wakes 15 min later · reads Slack · runs ASKs in chat · writes answers to disk · the meeting</text>

  <!-- Cowork sibling task box -->
  <rect x="80" y="375" width="220" height="120" rx="8" fill="#ffffff" stroke="#d97706" stroke-width="1.5"/>
  <text x="190" y="398" text-anchor="middle" font-size="10" font-weight="600" fill="#d97706" letter-spacing="1">DESKTOP SIBLING</text>
  <text x="190" y="418" text-anchor="middle" font-size="13" font-weight="600" fill="#111827">Cowork task</text>
  <text x="190" y="438" text-anchor="middle" font-size="11" fill="#4b5563">7:15 AM Mon–Fri</text>
  <text x="190" y="458" text-anchor="middle" font-size="11" fill="#4b5563">1. mirror Slack → disk</text>
  <text x="190" y="476" text-anchor="middle" font-size="11" fill="#4b5563">2. drive ASKs serially</text>

  <!-- Conversation box -->
  <rect x="390" y="375" width="220" height="120" rx="8" fill="#ffffff" stroke="#d97706" stroke-width="1.5"/>
  <text x="500" y="398" text-anchor="middle" font-size="10" font-weight="600" fill="#d97706" letter-spacing="1">LIVE CONVERSATION</text>
  <text x="500" y="418" text-anchor="middle" font-size="13" font-weight="600" fill="#111827">in Cowork</text>
  <text x="500" y="438" text-anchor="middle" font-size="11" fill="#4b5563">one question per turn</text>
  <text x="500" y="458" text-anchor="middle" font-size="11" fill="#4b5563">you answer · brain writes</text>
  <text x="500" y="476" text-anchor="middle" font-size="11" fill="#4b5563">state captured in real time</text>

  <!-- Brain box (bottom right) -->
  <rect x="700" y="375" width="220" height="120" rx="8" fill="#ecfdf5" stroke="#059669" stroke-width="1.5"/>
  <text x="810" y="398" text-anchor="middle" font-size="10" font-weight="600" fill="#059669" letter-spacing="1">BRAIN (UPDATED)</text>
  <text x="810" y="418" text-anchor="middle" font-size="13" font-weight="600" fill="#064e3b">~/kubrick-brain/</text>
  <text x="810" y="438" text-anchor="middle" font-size="11" fill="#065f46">todos · domain files</text>
  <text x="810" y="458" text-anchor="middle" font-size="11" fill="#065f46">shots · journal</text>
  <text x="810" y="476" text-anchor="middle" font-size="11" fill="#065f46">next brief reads truth</text>

  <!-- arrows in layer 2 -->
  <line x1="300" y1="435" x2="385" y2="435" stroke="#d97706" stroke-width="1.5" marker-end="url(#arrow-amber)"/>
  <text x="342" y="428" text-anchor="middle" font-size="10" fill="#d97706">pull ASKs</text>

  <line x1="610" y1="435" x2="695" y2="435" stroke="#059669" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="652" y="428" text-anchor="middle" font-size="10" fill="#059669">capture</text>

  <!-- Cross-layer arrow: Slack -> Desktop sibling -->
  <path d="M 500 260 Q 280 290 190 370" fill="none" stroke="#d97706" stroke-width="1.5" marker-end="url(#arrow-amber)"/>
  <text x="290" y="305" text-anchor="middle" font-size="10" fill="#d97706">sibling reads Slack at 7:15</text>

  <!-- Footer caption -->
  <text x="500" y="552" text-anchor="middle" font-size="11" fill="#6b7280">Routine asks. Conversation answers. Brain learns. Skip layer 2 and the questions stay open forever.</text>
</svg>
