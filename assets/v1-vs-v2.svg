<svg viewBox="0 0 1200 620" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc" style="font-family: ui-sans-serif, system-ui, sans-serif;">
  <title id="title">v1 vs v2 substrate comparison</title>
  <desc id="desc">v1 ran entirely on the desktop: brain folder in Documents, heartbeats as Cowork scheduled tasks, output to Cowork chat. v2 cuts the heartbeats loose from the laptop: brain syncs to a private GitHub repo, cloud Routines fire on schedule and read the repo, output lands in Slack. The laptop becomes optional. v3 will move the runtime onto a server the principal controls.</desc>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#6b7280"/>
    </marker>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#3b82f6"/>
    </marker>
    <marker id="arrow-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#d97706"/>
    </marker>
  </defs>

  <!-- HEADER -->
  <text x="600" y="36" text-anchor="middle" font-size="20" font-weight="700" fill="#111827">The substrate changed. The chief of staff didn't.</text>
  <text x="600" y="58" text-anchor="middle" font-size="13" fill="#6b7280">v1 (desktop-only) → v2 (always-on, cloud-driven) → v3 (self-hosted, next)</text>

  <!-- ====== V1 PANEL (LEFT) ====== -->
  <g>
    <rect x="40" y="90" width="500" height="470" rx="14" fill="#fafafa" stroke="#d4d4d8" stroke-width="1.5"/>
    <text x="290" y="118" text-anchor="middle" font-size="12" font-weight="700" fill="#6b7280" letter-spacing="2">v1 — DESKTOP</text>
    <text x="290" y="138" text-anchor="middle" font-size="11" fill="#6b7280">brain · heartbeats · output — all local</text>

    <!-- v1 Laptop block -->
    <rect x="80" y="170" width="420" height="350" rx="10" fill="#ffffff" stroke="#d4d4d8" stroke-width="1.2"/>
    <text x="290" y="194" text-anchor="middle" font-size="11" font-weight="600" fill="#6b7280" letter-spacing="1">LAPTOP (required, awake)</text>

    <!-- v1 Brain folder -->
    <rect x="100" y="215" width="170" height="100" rx="8" fill="#f9fafb" stroke="#d4d4d8" stroke-width="1"/>
    <text x="185" y="235" text-anchor="middle" font-size="10" font-weight="600" fill="#6b7280" letter-spacing="1">BRAIN</text>
    <text x="185" y="256" text-anchor="middle" font-size="13" font-weight="600" fill="#111827">~/Documents/...</text>
    <text x="185" y="276" text-anchor="middle" font-size="11" fill="#4b5563">SOUL · USER · AGENTS</text>
    <text x="185" y="293" text-anchor="middle" font-size="11" fill="#4b5563">todos · domain files</text>
    <text x="185" y="310" text-anchor="middle" font-size="10" font-style="italic" fill="#d97706">⚠ TCC-blocked</text>

    <!-- v1 Heartbeats -->
    <rect x="310" y="215" width="170" height="100" rx="8" fill="#f9fafb" stroke="#d4d4d8" stroke-width="1"/>
    <text x="395" y="235" text-anchor="middle" font-size="10" font-weight="600" fill="#6b7280" letter-spacing="1">HEARTBEATS</text>
    <text x="395" y="256" text-anchor="middle" font-size="13" font-weight="600" fill="#111827">Cowork scheduled</text>
    <text x="395" y="276" text-anchor="middle" font-size="11" fill="#4b5563">morning brief · recap</text>
    <text x="395" y="293" text-anchor="middle" font-size="11" fill="#4b5563">goal-set · consolidation</text>
    <text x="395" y="310" text-anchor="middle" font-size="10" font-style="italic" fill="#6b7280">only fires if Cowork open</text>

    <!-- v1 read arrow -->
    <line x1="270" y1="265" x2="310" y2="265" stroke="#6b7280" stroke-width="1.4" marker-end="url(#arrow)"/>
    <text x="290" y="258" text-anchor="middle" font-size="10" fill="#6b7280">read</text>

    <!-- v1 Output -->
    <rect x="170" y="370" width="240" height="80" rx="8" fill="#f9fafb" stroke="#d4d4d8" stroke-width="1"/>
    <text x="290" y="390" text-anchor="middle" font-size="10" font-weight="600" fill="#6b7280" letter-spacing="1">OUTPUT</text>
    <text x="290" y="412" text-anchor="middle" font-size="13" font-weight="600" fill="#111827">Cowork chat</text>
    <text x="290" y="431" text-anchor="middle" font-size="11" fill="#4b5563">briefs · recaps appear in app</text>

    <!-- v1 arrows down to output -->
    <path d="M 395 320 Q 395 350 320 370" fill="none" stroke="#6b7280" stroke-width="1.4" marker-end="url(#arrow)"/>

    <!-- v1 Footer -->
    <text x="290" y="490" text-anchor="middle" font-size="11" fill="#6b7280">Shut the lid · the chief of staff stops.</text>
  </g>

  <!-- ====== V2 PANEL (RIGHT) ====== -->
  <g>
    <rect x="660" y="90" width="500" height="470" rx="14" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5"/>
    <text x="910" y="118" text-anchor="middle" font-size="12" font-weight="700" fill="#3b82f6" letter-spacing="2">v2 — ALWAYS-ON</text>
    <text x="910" y="138" text-anchor="middle" font-size="11" fill="#3b82f6">brain in repo · heartbeats in cloud · laptop optional</text>

    <!-- v2 Brain (local) -->
    <rect x="680" y="170" width="155" height="90" rx="8" fill="#ffffff" stroke="#bfdbfe" stroke-width="1.2"/>
    <text x="757" y="190" text-anchor="middle" font-size="10" font-weight="600" fill="#3b82f6" letter-spacing="1">LAPTOP (optional)</text>
    <text x="757" y="210" text-anchor="middle" font-size="13" font-weight="600" fill="#111827">~/kubrick-brain/</text>
    <text x="757" y="227" text-anchor="middle" font-size="11" fill="#4b5563">edit here as usual</text>
    <text x="757" y="246" text-anchor="middle" font-size="10" font-style="italic" fill="#3b82f6">launchd: push 5 min</text>

    <!-- v2 GitHub -->
    <rect x="985" y="170" width="155" height="90" rx="8" fill="#ffffff" stroke="#bfdbfe" stroke-width="1.2"/>
    <text x="1062" y="190" text-anchor="middle" font-size="10" font-weight="600" fill="#3b82f6" letter-spacing="1">GITHUB</text>
    <text x="1062" y="210" text-anchor="middle" font-size="13" font-weight="600" fill="#111827">private repo</text>
    <text x="1062" y="227" text-anchor="middle" font-size="11" fill="#4b5563">source of truth</text>
    <text x="1062" y="246" text-anchor="middle" font-size="10" font-style="italic" fill="#3b82f6">the bridge</text>

    <!-- v2 push -->
    <line x1="838" y1="207" x2="982" y2="207" stroke="#3b82f6" stroke-width="1.5" marker-end="url(#arrow-blue)"/>
    <text x="910" y="200" text-anchor="middle" font-size="10" font-weight="500" fill="#3b82f6">git push</text>
    <!-- v2 pull -->
    <line x1="982" y1="232" x2="838" y2="232" stroke="#6b7280" stroke-width="1.2" marker-end="url(#arrow)"/>
    <text x="910" y="248" text-anchor="middle" font-size="10" fill="#6b7280">git pull</text>

    <!-- v2 Cloud Routines -->
    <rect x="755" y="290" width="310" height="120" rx="8" fill="#ffffff" stroke="#3b82f6" stroke-width="1.5"/>
    <text x="910" y="312" text-anchor="middle" font-size="10" font-weight="600" fill="#3b82f6" letter-spacing="1">CLOUD ROUTINES</text>
    <text x="910" y="330" text-anchor="middle" font-size="12" fill="#4b5563">claude.ai/code/routines</text>

    <text x="775" y="354" font-size="11" fill="#111827">Mon AM</text>
    <text x="1045" y="354" text-anchor="end" font-size="11" fill="#4b5563">weekly goal-set</text>
    <text x="775" y="372" font-size="11" fill="#111827">Wkdy AM</text>
    <text x="1045" y="372" text-anchor="end" font-size="11" fill="#4b5563">morning brief</text>
    <text x="775" y="390" font-size="11" fill="#111827">Fri PM</text>
    <text x="1045" y="390" text-anchor="end" font-size="11" fill="#4b5563">weekly recap</text>

    <!-- v2 routines read repo -->
    <path d="M 1062 263 Q 1062 280 1010 290" fill="none" stroke="#3b82f6" stroke-width="1.5" marker-end="url(#arrow-blue)"/>
    <text x="1100" y="278" text-anchor="middle" font-size="10" fill="#3b82f6">read</text>

    <!-- v2 routines write repo (fails silently) -->
    <path d="M 985 305 Q 1100 290 1100 268" fill="none" stroke="#d97706" stroke-width="1.2" stroke-dasharray="3 2" marker-end="url(#arrow-amber)"/>
    <text x="1138" y="296" text-anchor="middle" font-size="10" fill="#d97706">write*</text>

    <!-- v2 Slack -->
    <rect x="680" y="290" width="65" height="120" rx="8" fill="#ffffff" stroke="#bfdbfe" stroke-width="1.2"/>
    <text x="712" y="312" text-anchor="middle" font-size="9" font-weight="600" fill="#3b82f6" letter-spacing="1">SLACK</text>
    <text x="712" y="340" text-anchor="middle" font-size="11" fill="#111827">briefs</text>
    <text x="712" y="358" text-anchor="middle" font-size="11" fill="#111827">recaps</text>
    <text x="712" y="376" text-anchor="middle" font-size="11" fill="#111827">ASKs</text>

    <!-- v2 routines → slack -->
    <line x1="755" y1="350" x2="747" y2="350" stroke="#3b82f6" stroke-width="1.5" marker-end="url(#arrow-blue)"/>
    <text x="751" y="395" text-anchor="middle" font-size="10" fill="#3b82f6">post</text>

    <!-- v2 Sibling task -->
    <rect x="755" y="440" width="310" height="80" rx="8" fill="#fff7ed" stroke="#d97706" stroke-width="1.2" stroke-dasharray="3 2"/>
    <text x="910" y="461" text-anchor="middle" font-size="10" font-weight="600" fill="#d97706" letter-spacing="1">DESKTOP SIBLING (closure)</text>
    <text x="910" y="481" text-anchor="middle" font-size="12" font-weight="600" fill="#111827">Cowork task — 7 AM</text>
    <text x="910" y="500" text-anchor="middle" font-size="10" fill="#9a3412">mirror Slack → disk + drive ASKs</text>

    <!-- v2 sibling reads slack -->
    <path d="M 712 410 Q 712 440 810 440" fill="none" stroke="#d97706" stroke-width="1.2" marker-end="url(#arrow-amber)"/>
    <!-- v2 sibling writes to laptop -->
    <path d="M 855 440 Q 800 420 757 260" fill="none" stroke="#d97706" stroke-width="1.2" stroke-dasharray="3 2" marker-end="url(#arrow-amber)"/>

    <!-- v2 caveat note -->
    <text x="910" y="546" text-anchor="middle" font-size="10" fill="#9a3412" font-style="italic">* repo write-back leg fails silently — desktop sibling closes the gap</text>
  </g>

  <!-- BOTTOM TRANSITION ARROW: v1 → v2 → v3 -->
  <text x="600" y="595" text-anchor="middle" font-size="11" fill="#6b7280">v3 next: VPS + Agent SDK — runtime moves onto a server the principal controls.</text>
</svg>
