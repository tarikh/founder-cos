<svg viewBox="0 0 1200 620" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc" style="font-family: ui-sans-serif, system-ui, sans-serif;">
  <title id="title">v2 vs v3 substrate comparison</title>
  <desc id="desc">v2 makes the chief of staff always-on with cloud Routines and a private GitHub repo. v3 adds a custom Slack app and VPS worker so inbound conversation and captures happen in the working channel.</desc>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#6b7280"/>
    </marker>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2563eb"/>
    </marker>
    <marker id="arrow-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#d97706"/>
    </marker>
  </defs>

  <rect width="1200" height="620" fill="#fbfbfb"/>
  <text x="600" y="38" text-anchor="middle" font-size="21" font-weight="700" fill="#111827">v2 made it always-on. v3 makes it reachable.</text>
  <text x="600" y="61" text-anchor="middle" font-size="13" fill="#6b7280">Same brain, different surface and runtime boundary.</text>

  <g>
    <rect x="45" y="95" width="520" height="450" rx="14" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5"/>
    <text x="305" y="124" text-anchor="middle" font-size="12" font-weight="700" fill="#3b82f6" letter-spacing="2">v2 — ALWAYS-ON</text>
    <text x="305" y="146" text-anchor="middle" font-size="12" fill="#2563eb">cloud heartbeats, private repo, split interaction layer</text>

    <rect x="85" y="185" width="160" height="84" rx="9" fill="#ffffff" stroke="#bfdbfe" stroke-width="1.2"/>
    <text x="165" y="211" text-anchor="middle" font-size="11" font-weight="700" fill="#2563eb">Laptop</text>
    <text x="165" y="233" text-anchor="middle" font-size="13" font-weight="700" fill="#111827">brain folder</text>
    <text x="165" y="252" text-anchor="middle" font-size="11" fill="#4b5563">sync every 5 min</text>

    <rect x="360" y="185" width="160" height="84" rx="9" fill="#ffffff" stroke="#bfdbfe" stroke-width="1.2"/>
    <text x="440" y="211" text-anchor="middle" font-size="11" font-weight="700" fill="#2563eb">GitHub</text>
    <text x="440" y="233" text-anchor="middle" font-size="13" font-weight="700" fill="#111827">private repo</text>
    <text x="440" y="252" text-anchor="middle" font-size="11" fill="#4b5563">source of truth</text>

    <line x1="247" y1="222" x2="357" y2="222" stroke="#2563eb" stroke-width="1.5" marker-end="url(#arrow-blue)"/>
    <text x="305" y="212" text-anchor="middle" font-size="10" fill="#2563eb">push</text>
    <line x1="357" y1="246" x2="247" y2="246" stroke="#6b7280" stroke-width="1.2" marker-end="url(#arrow)"/>

    <rect x="155" y="315" width="300" height="100" rx="10" fill="#ffffff" stroke="#3b82f6" stroke-width="1.5"/>
    <text x="305" y="342" text-anchor="middle" font-size="11" font-weight="700" fill="#2563eb" letter-spacing="1">CLOUD ROUTINES</text>
    <text x="305" y="365" text-anchor="middle" font-size="13" font-weight="700" fill="#111827">scheduled heartbeats</text>
    <text x="305" y="385" text-anchor="middle" font-size="11" fill="#4b5563">brief · goal-set · recap · consolidation</text>
    <text x="305" y="402" text-anchor="middle" font-size="10" font-style="italic" fill="#6b7280">good alarm clock, limited live loop</text>

    <path d="M 440 270 Q 440 300 400 315" fill="none" stroke="#2563eb" stroke-width="1.4" marker-end="url(#arrow-blue)"/>

    <rect x="95" y="455" width="420" height="54" rx="9" fill="#ffffff" stroke="#bfdbfe" stroke-width="1.2"/>
    <text x="305" y="487" text-anchor="middle" font-size="13" font-weight="700" fill="#111827">Output lands in Slack, closure still needs another layer</text>
  </g>

  <g>
    <rect x="635" y="95" width="520" height="450" rx="14" fill="#f8fafc" stroke="#2563eb" stroke-width="2"/>
    <text x="895" y="124" text-anchor="middle" font-size="12" font-weight="700" fill="#2563eb" letter-spacing="2">v3 — SLACK + VPS</text>
    <text x="895" y="146" text-anchor="middle" font-size="12" fill="#2563eb">interactive channel, owned runtime, direct capture</text>

    <rect x="675" y="185" width="140" height="84" rx="9" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/>
    <text x="745" y="211" text-anchor="middle" font-size="11" font-weight="700" fill="#64748b">Phone</text>
    <text x="745" y="233" text-anchor="middle" font-size="13" font-weight="700" fill="#111827">Slack</text>
    <text x="745" y="252" text-anchor="middle" font-size="11" fill="#4b5563">typed or dictated</text>

    <rect x="875" y="185" width="230" height="84" rx="9" fill="#ffffff" stroke="#2563eb" stroke-width="1.5"/>
    <text x="990" y="211" text-anchor="middle" font-size="11" font-weight="700" fill="#2563eb">Custom app</text>
    <text x="990" y="233" text-anchor="middle" font-size="13" font-weight="700" fill="#111827">CoS channel + threads</text>
    <text x="990" y="252" text-anchor="middle" font-size="11" fill="#4b5563">no mention ritual</text>

    <line x1="817" y1="227" x2="872" y2="227" stroke="#2563eb" stroke-width="1.5" marker-end="url(#arrow-blue)"/>

    <rect x="745" y="315" width="300" height="100" rx="10" fill="#ffffff" stroke="#2563eb" stroke-width="1.5"/>
    <text x="895" y="342" text-anchor="middle" font-size="11" font-weight="700" fill="#2563eb" letter-spacing="1">VPS WORKER</text>
    <text x="895" y="365" text-anchor="middle" font-size="13" font-weight="700" fill="#111827">agent turns + serialized git writer</text>
    <text x="895" y="385" text-anchor="middle" font-size="11" fill="#4b5563">read/edit/write brain files</text>
    <text x="895" y="402" text-anchor="middle" font-size="10" font-style="italic" fill="#6b7280">model does not run git</text>

    <path d="M 990 270 Q 990 300 960 315" fill="none" stroke="#2563eb" stroke-width="1.4" marker-end="url(#arrow-blue)"/>

    <rect x="675" y="455" width="180" height="54" rx="9" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/>
    <text x="765" y="487" text-anchor="middle" font-size="13" font-weight="700" fill="#111827">private brain repo</text>

    <rect x="905" y="455" width="200" height="54" rx="9" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/>
    <text x="1005" y="487" text-anchor="middle" font-size="13" font-weight="700" fill="#111827">heartbeats can stay</text>

    <path d="M 850 415 Q 805 440 775 455" fill="none" stroke="#2563eb" stroke-width="1.4" marker-end="url(#arrow-blue)"/>
    <path d="M 945 415 Q 980 440 1000 455" fill="none" stroke="#d97706" stroke-width="1.3" stroke-dasharray="4 3" marker-end="url(#arrow-amber)"/>
  </g>

  <text x="600" y="585" text-anchor="middle" font-size="13" font-weight="700" fill="#111827">The difference is not always-on. v2 already had that.</text>
  <text x="600" y="606" text-anchor="middle" font-size="12" fill="#6b7280">The difference is reachability plus control: the CoS lives in the channel, backed by a runtime you own.</text>
</svg>
